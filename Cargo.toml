[package]
name = "vs-nimages"
version = "0.3.0"
edition = "2024"
authors = ["noaione <noaione@n4o.xyz>"]
license = "MPL-2.0"
readme = "./README.md"
keywords = ["vapoursynth", "image-manipulation", "image-analyzer"]
description = "A collection of analyzer and tooling to manipulate images with VapourSynth"
repository = "https://github.com/noaione/vs-nimages"
homepage = "https://github.com/noaione/vs-nimages"
rust-version = "1.95.0"

[lib]
# `cdylib` is the VapourSynth plugin; `rlib` exists so the integration tests in
# `tests/` can link the algorithm modules directly.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Upstream carries the Vulkan half: `vulkan` enables the ash-based
# `VSVULKANAPI` table, which `src/vulkan.rs` wraps.
vapoursynth4-rs = { version = "0.6.0", default-features = false, features = [
    "vs-43", # >=R80
    "vulkan", # >=R80
    "vsscript-44", # required by the binding, not used here
] }

# Test-only. The golden vectors in tests/fixtures are generated by tools/golden.py
# and shared with the Python integration tests, so they are stored as JSON.
[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
incremental = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
