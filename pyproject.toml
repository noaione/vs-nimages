[project]
name = "vapoursynth-nimages"
version = "0.1.0"
description = "A native VapourSynth plugin for analyzing and manipulating images"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MPL-2.0" }
authors = [
    { name = "noaione", email = "noaione@n4o.xyz" },
]
keywords = [
    "vapoursynth",
    "video-processing",
    "image-analyzing",
    "rust",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Plugins",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/noaione/vs-nimages"
Repository = "https://github.com/noaione/vs-nimages"
Issues = "https://github.com/noaione/vs-nimages/issues"
Changelog = "https://github.com/noaione/vs-nimages/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "hatchling>=1.27",
    "packaging>=26.3",
    "VapourSynth>=79",
    "vsrepo>=2.0"
]
dev-tests = [
    "natsort>=8.4.0",
    "numpy>=2.0",
    "vapoursynth-imageseqs>=0.1.0",
]
# `tools/golden.py` only. it imports `nmanga.autolevel` from a sibling checkout,
# which needs numpy, scipy and pillow to run the reference implementation.
golden = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pillow>=12",
]

[build-system]
requires = ["hatchling>=1.27", "packaging"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["vapoursynth/plugins"]
artifacts = [
    "vapoursynth/plugins/nimages/**",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "src/**/*.rs",
    "hatch_build.py",
    "pyproject.toml",
    "README.md",
    "CHANGELOG.md",
    "tools/create-changelog.py",
    "LICENSE",
]
