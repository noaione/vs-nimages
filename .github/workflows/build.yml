name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    uses: ./.github/workflows/rust-tests.yml

  linux-wheel:
    name: linux-x86_64 (manylinux)
    needs: rust-tests
    runs-on: ubuntu-26.04
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64@sha256:407f771c51a2c3e83ebe5a7970b4289ead3a6db21d9b9c089168775cad11d328
    defaults:
      run:
        shell: bash

    steps:
      - name: check out source
        uses: actions/checkout@v7

      - name: set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: build and repair Linux wheel
        run: |
          set -euo pipefail
          export PATH="/opt/python/cp312-cp312/bin:$PATH"
          python -m pip install --upgrade build auditwheel numpy "VapourSynth>=79,<81"
          python -m build --wheel --outdir dist
          auditwheel show dist/*.whl
          auditwheel repair --plat manylinux_2_28_x86_64 --wheel-dir repaired dist/*.whl

      - name: install repaired wheel and run integration checks
        run: |
          set -euo pipefail
          export PATH="/opt/python/cp312-cp312/bin:$PATH"
          python -c "import pathlib, subprocess, sys; wheel, = pathlib.Path('repaired').glob('*.whl'); subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', str(wheel)], check=True)"
          python tests/check-nimages.py

      - name: upload Linux wheel
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64-wheel
          path: repaired/*.whl
          if-no-files-found: error

  native-wheels:
    name: ${{ matrix.name }}
    needs: rust-tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-26
          - name: windows-x86_64
            os: windows-2025

    steps:
      - name: check out source
        uses: actions/checkout@v7

      - name: set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: install build and integration dependencies
        run: python -m pip install --upgrade build numpy "VapourSynth>=79,<81" "vapoursynth-imageseqs>=0.2.0"

      - name: install image sequence codec libraries
        if: runner.os == 'macOS'
        run: brew install dav1d libde265

      - name: build wheel
        run: python -m build --wheel --outdir dist

      - name: install wheel and run integration checks
        run: |
          python -c "import pathlib, subprocess, sys; wheel, = pathlib.Path('dist').glob('*.whl'); subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', str(wheel)], check=True)"
          python tests/check-nimages.py

      - name: upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-wheel
          path: dist/*.whl
          if-no-files-found: error

  source-distribution:
    name: source distribution
    needs: rust-tests
    runs-on: ubuntu-26.04

    steps:
      - name: check out source
        uses: actions/checkout@v7

      - name: set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: install build frontend
        run: python -m pip install --upgrade build

      - name: build source distribution and wheel from it
        run: |
          python -m build --sdist --outdir dist
          python -m build --wheel --outdir rebuilt-wheel dist/*.tar.gz

      - name: upload source distribution
        uses: actions/upload-artifact@v7
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error
